<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scribe</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fragment+Mono:ital@0;1&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fenix&display=swap" rel="stylesheet">
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
</head>
<body>

  <header>
    <h1>Scribe <span>(Beta)</span></h1>
    <img src="vase.png" alt="Black and white close-up of a round vase" class="vase"> 
  </header>
    
  <main>
    <section class="prompt-header">
      <h2 class="prompt-title">Who do you love?</h2>
      <h3 class="prompt-subtitle">How do they help you feel seen?</h3>
    </section>

    <div id="prompts"></div>

    <form id="prompt-form">
      <label>
        Name
        <input type="text" name="name" placeholder="Oshun" required>
      </label>
      <label>
        Location
        <input type="text" name="location" placeholder="Moon" required>
      </label>
      <label>
        Response
        <textarea name="response" placeholder="As if everything is falling into place" required></textarea>
      </label>
      <button type="submit">Submit ></button>
    </form>
  </main>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBp2QOnTd_0PtX1PCivKLozg9vGIz5OLzQ",
      authDomain: "scribe-61849.firebaseapp.com",
      projectId: "scribe-61849",
      storageBucket: "scribe-61849.appspot.com",
      messagingSenderId: "209905470454",
      appId: "1:209905470454:web:118eceef8d217556cdd5d7"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const form = document.getElementById('prompt-form');
    const prompts = document.getElementById('prompts');

    function formatDate(date) {
      return date.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    }

    form.addEventListener('submit', async e => {
      e.preventDefault();
      const name = form.name.value.trim();
      const location = form.location.value.trim();
      const response = form.response.value.trim();

      if (!name || !location || !response) return alert("Please fill out all fields.");

      await db.collection('prompts').add({
        name,
        location,
        response,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      });

      form.reset();
    });

    db.collection('prompts')
      .orderBy('timestamp', 'desc')
      .onSnapshot(snapshot => {
        prompts.innerHTML = '';
        snapshot.forEach(doc => {
          const data = doc.data();
          const date = data.timestamp ? data.timestamp.toDate() : new Date();
          const entry = document.createElement('div');
          entry.className = 'prompt-entry';
          entry.innerHTML = `
            <div class="prompt-meta">
              <span class="name">${data.name}</span>
              <span class="time">${formatDate(date)}</span>
              <span class="location">${data.location}</span>
            </div>
            <div class="prompt-text">${data.response}</div>
          `;
          prompts.appendChild(entry);
        });
        prompts.scrollTo({ top: 0, behavior: 'smooth' });
      });
  </script>
</body>
</html>
